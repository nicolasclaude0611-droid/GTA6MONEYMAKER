.stage{aspect-ratio:auto!important;width:100vw!important;height:100vh!important;height:100dvh!important}
.wheelwrap{max-width:min(54vh,54dvh)}
#scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}

.top{position:absolute;top:5%;left:5%;right:5%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.kicker{font-family:var(--cond);font-size:calc(var(--u)*4.2);letter-spacing:.32em;color:#ffe2b8;opacity:.9}
.headline{font-family:var(--display);text-transform:uppercase;line-height:.95;font-size:calc(var(--u)*10.5);text-wrap:balance;
  background:linear-gradient(180deg,#fff 0%,#ffe1ef 45%,#ff9ec2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #7a1f55) drop-shadow(0 0 16px rgba(255,93,143,.55))}

.logo{width:calc(var(--u)*36);height:auto;display:block;margin-top:calc(var(--u)*1);filter:drop-shadow(0 4px 10px rgba(20,6,40,.55))}
.wheelwrap{position:relative;width:84%;aspect-ratio:1}
#wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 30px rgba(20,6,40,.6)) drop-shadow(0 0 24px rgba(255,120,170,.45))}
.pointer{position:absolute;top:-1.5%;left:50%;transform:translateX(-50%);width:9%;z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:19%;aspect-ratio:1;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 38% 30%,#4a2a68 0,#1a0d2b 70%);border:4px solid var(--gold);
  box-shadow:0 0 0 3px #1a0d2b,0 0 22px rgba(243,197,107,.7),inset 0 0 14px rgba(0,0,0,.6);
  display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--u)*3.4);color:var(--gold);letter-spacing:.04em}

.cta{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.cta b{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*6.2);text-transform:uppercase;color:#fff;
  background:linear-gradient(180deg,#ff7aa6,#e23d76);padding:8px 22px;border-radius:999px;
  box-shadow:0 4px 0 #8c1f4c,0 0 22px rgba(255,93,143,.6);animation:pulse 2.4s ease-in-out infinite}
.cta small{font-weight:600;font-size:calc(var(--u)*2.6);color:#fff;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.6)}
@keyframes pulse{50%{transform:scale(1.02)}}

.result{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:6%;
  background:radial-gradient(circle at 50% 48%,rgba(255,190,110,.35),rgba(20,8,36,.65) 70%)}
.rays{position:absolute;left:50%;top:48%;width:160%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;
  background:repeating-conic-gradient(rgba(255,226,170,.22) 0 8deg,transparent 8deg 20deg);animation:spinr 8s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%)}
@keyframes spinr{to{transform:translate(-50%,-50%) rotate(360deg)}}
.marquee{position:relative;text-align:center;padding:16px 30px 14px;border-radius:14px;background:#2a1238;
  border:3px solid #ff7aa6;box-shadow:0 0 0 7px #2a1238,0 0 0 10px var(--gold),0 0 40px rgba(255,111,160,.85);
  animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.bulbs{position:absolute;inset:-6px;border-radius:18px;pointer-events:none;
  background:radial-gradient(circle,#fff1c4 0 2.6px,transparent 3.2px) 0 0/18px 18px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:5px;
  animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.marquee span{display:block;white-space:nowrap;font-family:var(--display);font-size:calc(var(--u)*11);line-height:1;
  background:linear-gradient(180deg,#fff6d8,#f3c56b 60%,#e59a3a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #9c2a59)}
.marquee em{display:block;font-style:normal;font-weight:800;font-size:calc(var(--u)*3.2);letter-spacing:.08em;color:#fff4ea;margin-top:6px}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.resbox{display:flex;flex-direction:column;align-items:center;gap:min(3vh,24px)}
.rescover{display:block;width:auto;height:auto;max-height:min(56vh,56dvh);max-width:72vw;border-radius:10px;
  border:4px solid var(--gold);box-shadow:0 0 0 6px #2a1238,0 0 60px rgba(255,190,110,.75),0 20px 50px rgba(0,0,0,.55);
  animation:coverIn .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes coverIn{from{transform:scale(.3) rotate(-12deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.rescover{animation:none}}
.claim{display:inline-block;font-family:var(--display);font-size:calc(var(--u)*7);text-transform:uppercase;color:#fff;text-decoration:none;cursor:pointer;
  background:linear-gradient(180deg,#ff7aa6,#e23d76);padding:.3em 1.1em;border-radius:999px;margin-top:min(1vh,8px);
  box-shadow:0 4px 0 #8c1f4c,0 0 22px rgba(255,93,143,.6);animation:pulse 2.4s ease-in-out infinite}
.claim:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
#confetti{position:absolute;inset:0;z-index:6;pointer-events:none;width:100%;height:100%}

.panel{width:min(100%,340px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--pink)}
.panel label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel input[type=text],.panel textarea{font:inherit;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--night);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.panel textarea{min-height:150px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:800;letter-spacing:.06em;border:0;border-radius:8px;padding:11px 14px;cursor:pointer;background:var(--line);color:var(--ink)}
button.go{background:var(--pink);flex:1}
button:focus-visible,input:focus-visible,textarea:focus-visible,.hub:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.check{flex-direction:row!important;align-items:center;text-transform:none!important;letter-spacing:0!important;font-size:14px!important;color:var(--ink)!important}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
body.recording .panel{display:none}
.exit{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));opacity:.25;font-size:11px;padding:6px 8px}
.exit:hover{opacity:1}
@media (prefers-reduced-motion:reduce){.cta b,.rays,.bulbs{animation:none}}

/* ---------- tiro al blanco de feria ---------- */
.booth{position:relative;width:96%;max-width:min(62vh,62dvh);aspect-ratio:1.05;flex-shrink:0;border-radius:16px;overflow:hidden;cursor:crosshair;
  background:radial-gradient(ellipse at 50% 30%,#4a2a68 0,#2a1640 55%,#1a0d2b 100%);
  border:4px solid var(--gold);box-shadow:0 0 0 5px #1a0d2b,0 0 26px rgba(243,197,107,.55),0 0 40px rgba(255,120,170,.4),inset 0 0 30px rgba(0,0,0,.6)}
.awning{position:absolute;left:0;right:0;top:0;height:13%;z-index:4;
  background:repeating-linear-gradient(90deg,#ff7aa6 0 12.5%,#3cc1bd 12.5% 25%);
  -webkit-mask:radial-gradient(circle at 50% 100%,transparent 0 30%,#000 31%) 0 0/12.5% 100%;
  mask:radial-gradient(circle at 50% 100%,transparent 0 30%,#000 31%) 0 0/12.5% 100%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.bulbrow{position:absolute;left:3%;right:3%;top:2%;height:3%;z-index:5;
  background:radial-gradient(circle,#fff1c4 0 2.6px,transparent 3.2px) 0 50%/18px 100% repeat-x;animation:blink .5s steps(2) infinite}
.rail{position:absolute;left:0;right:0;height:25%}
.rail::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7%;background:linear-gradient(180deg,#fff2c7,#c9832f);box-shadow:0 2px 6px rgba(0,0,0,.6)}
.r0{top:16%}.r1{top:44%}.r2{top:72%}
.tgt{position:absolute;bottom:6%;width:21%;left:0;height:92%;will-change:transform}
.flip{position:absolute;inset:0;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.4,1.6,.5,1)}
.tgt .face{position:absolute;left:0;right:0;top:0;height:76%;display:grid;place-items:center}
.tgt .face svg,.tgt .face img{max-width:100%;max-height:100%;display:block;filter:drop-shadow(0 4px 5px rgba(0,0,0,.55))}
.tgt .face img{border-radius:6px;border:3px solid var(--gold);box-shadow:0 0 0 3px #2a1238,0 0 16px rgba(255,190,110,.8)}
.tgt .stick{position:absolute;left:46%;width:8%;top:74%;bottom:0;background:linear-gradient(90deg,#8a5a20,#f3c56b,#8a5a20);border-radius:3px}
.tgt.down .flip{transform:perspective(400px) rotateX(-82deg)}
.tgt.down .face{filter:brightness(.5)}
.pop{position:absolute;z-index:6;pointer-events:none;font-family:var(--display);font-size:calc(var(--u)*5);color:var(--gold);
  text-shadow:0 2px 0 #7a1f55,0 0 10px rgba(243,197,107,.8);transform:translate(-50%,-50%);animation:popup .9s ease-out forwards}
@keyframes popup{to{transform:translate(-50%,-180%);opacity:0}}
.hole{position:absolute;z-index:6;pointer-events:none;width:5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#fff 0 18%,#ffd77a 30%,rgba(255,93,143,.6) 55%,transparent 70%);animation:flash .35s ease-out forwards}
@keyframes flash{to{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
.hud{display:flex;justify-content:space-between;align-items:center;width:96%;max-width:min(62vh,62dvh);gap:10px}
.ammo{display:flex;gap:calc(var(--u)*1)}
.ammo i{display:block;width:calc(var(--u)*2.2);height:calc(var(--u)*6);border-radius:40% 40% 3px 3px;
  background:linear-gradient(90deg,#9c6a2a,#fff2c7 40%,#f3c56b 60%,#8a5a20);box-shadow:0 0 6px rgba(243,197,107,.6)}
.ammo i.used{opacity:.18;box-shadow:none}
.score{font-family:var(--display);font-size:calc(var(--u)*5);color:#fff;text-shadow:0 3px 0 #7a1f55,0 0 14px rgba(255,93,143,.6)}
.status{font-family:var(--display);font-size:calc(var(--u)*4.6);text-transform:uppercase;color:#fff;text-align:center;min-height:1.2em;
  text-shadow:0 3px 0 #7a1f55,0 0 16px rgba(255,93,143,.65)}
.go-btn{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*5.6);text-transform:uppercase;color:var(--gold);letter-spacing:.04em;
  background:radial-gradient(circle at 38% 30%,#4a2a68 0,#1a0d2b 70%);border:4px solid var(--gold);border-radius:999px;padding:.35em 1.2em;
  box-shadow:0 0 0 3px #1a0d2b,0 0 22px rgba(243,197,107,.7),inset 0 0 14px rgba(0,0,0,.6)}
.go-btn.off{visibility:hidden}
.stage{gap:calc(var(--u)*2.4)}
@media (prefers-reduced-motion:reduce){.bulbrow{animation:none}}

  car:{pts:200,svg:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#36a9b0" stroke="#f3c56b" stroke-width="6"/><path d="M16 62l2-10 16-4 8-12h24l10 12 10 3 1 11z" fill="#ff5d8f" stroke="#2a1844" stroke-width="3" stroke-linejoin="round"/><path d="M45 40h18l7 9H39z" fill="#ffd6e5"/><circle cx="32" cy="64" r="7" fill="#2a1844"/><circle cx="70" cy="64" r="7" fill="#2a1844"/></svg>'}
};
const ROWS=[
  ['star','cover','cash','bag','palm'],      // fila de arriba: la más rápida, con GTA VI
  ['car','cash','paypal','star','bag'],
  ['palm','bag','car','cash','star']
];
const GAP=26;                                // separación entre blancos (% del ancho)

const booth=document.getElementById('booth'),goBtn=document.getElementById('goBtn'),statusEl=document.getElementById('status');
const rails=[...booth.querySelectorAll('.rail')];
let rows=[],state='idle',bullets=BULLETS,score=0,offs=[0,0,0],last=0;
ROWS.forEach((list,r)=>{rows[r]=list.map((kind,i)=>{const el=document.createElement('div');el.className='tgt';el.dataset.kind=kind;
  const face=kind==='cover'?`<img src="${COVER_SRC}" alt="GTA VI">`:kind==='paypal'?`<img src="${PAYPAL_SRC}" alt="PayPal">`:ICONS[kind].svg;
  el.innerHTML=`<div class="flip"><div class="face">${face}</div><div class="stick"></div></div>`;rails[r].appendChild(el);return {el,i,kind,wasX:0};});});
offs=[Math.random()*130,Math.random()*130,Math.random()*130];   // posición inicial al azar

function layout(){
  rows.forEach((row,r)=>{const L=row.length*GAP;
    row.forEach(t=>{let x=((offs[r]+t.i*GAP)%L+L)%L-GAP;      // de -GAP a L-GAP
      if(Math.abs(x-t.wasX)>GAP*2)t.el.classList.remove('down');  // al dar la vuelta, el blanco se levanta otra vez
      t.wasX=x;t.el.style.transform=`translateX(${x/21*100}%)`;});});
}
function loop(now){const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  if(state==='play'||state==='idle')SPEED.forEach((s,r)=>offs[r]+=s*dt*(state==='idle'?.22:1));
  layout();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* ---------- sonido (igual que la ruleta + disparo) ---------- */
const snd={checked:true};
let actx;function au(){if(!actx){const AC=window.AudioContext||window.webkitAudioContext;actx=new AC();}if(actx.state!=='running')actx.resume().catch(()=>{});return actx}
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
function unlockAudio(){try{const a=au(),b=a.createBuffer(1,1,22050),src=a.createBufferSource();src.buffer=b;src.connect(a.destination);src.start(0);}catch(e){}}
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,unlockAudio,{capture:true,passive:true}));
function bang(){if(!snd.checked)return;try{const a=au(),n=a.sampleRate*.18,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
  f.type='lowpass';f.frequency.value=2200;g.gain.value=.5;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start();}catch(e){}}
function ding(hi){if(!snd.checked)return;try{const a=au(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=hi?1568:1175;
  g.gain.setValueAtTime(.22,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.4);}catch(e){}}
function fanfare(win){if(!snd.checked)return;try{const a=au();(win?[523,659,784,1047,1319]:[392,330]).forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;const t=a.currentTime+i*.11;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.55);});}catch(e){}}

/* ---------- juego ---------- */
function drawAmmo(){document.getElementById('ammo').innerHTML=Array.from({length:BULLETS},(_,i)=>`<i class="${i<BULLETS-bullets?'used':''}"></i>`).join('');}
function drawScore(){document.getElementById('score').textContent='$'+score;}
function start(){
  if(state==='play')return;unlockAudio();hideResult();
  bullets=BULLETS;score=0;drawAmmo();drawScore();rows.flat().forEach(t=>t.el.classList.remove('down'));
  statusEl.textContent='Hit the GTA VI target 🎯';goBtn.classList.add('off');state='play';
}
function fx(cls,x,y,txt){const d=document.createElement('div');d.className=cls;d.style.left=x+'px';d.style.top=y+'px';if(txt)d.textContent=txt;booth.appendChild(d);setTimeout(()=>d.remove(),1000);}
booth.addEventListener('pointerdown',e=>{
  if(state!=='play')return;e.preventDefault();
  const b=booth.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  bullets--;drawAmmo();bang();fx('hole',x,y);
  const el=e.target.closest('.tgt');
  if(el&&!el.classList.contains('down')){
    el.classList.add('down');const k=el.dataset.kind;
    if(k==='cover'){ding(true);fx('pop',x,y,'GTA VI!');return end('cover');}
    if(k==='paypal'){ding(true);fx('pop',x,y,'BONUS!');return end('paypal');}
    score+=ICONS[k].pts;drawScore();ding(false);fx('pop',x,y,'+$'+ICONS[k].pts);
  }
  if(bullets<=0)end(null);
});
function end(prize){
  state='done';statusEl.textContent=prize?'Nice shot! 🎉':'Out of bullets!';
  setTimeout(()=>{showResult(prize);goBtn.textContent='PLAY AGAIN';goBtn.classList.remove('off');state='idle';},prize?700:900);
}

/* ---------- resultado (mismo cartel que la ruleta) ---------- */
function hideResult(){clearTimeout(showResult.t);document.getElementById('result').hidden=true;}
function showResult(prize){const win=!!prize,bonus=prize==='paypal';
  document.getElementById('resBig').textContent=bonus?'BONUS!':win?'SUPER WIN':'SO CLOSE';
  document.getElementById('resText').textContent=bonus?'PAYPAL €10':win?'WIN GTA VI':'SCORE $'+score;
  const rc=document.getElementById('resCover');if(win)rc.src=bonus?PAYPAL_SRC:COVER_SRC;rc.hidden=!win;
  const r=document.getElementById('result');r.hidden=false;fanfare(win);if(win)confetti();
  const cb=document.getElementById('claimBtn');cb.hidden=!win;
  if(CLAIM_URL){cb.href=CLAIM_URL;cb.target='_blank';cb.rel='noopener'}else cb.removeAttribute('href');
  clearTimeout(showResult.t);if(!win)showResult.t=setTimeout(()=>r.hidden=true,4000);}
document.getElementById('result').addEventListener('click',e=>{if(!e.target.closest('.claim'))e.currentTarget.hidden=true});
function confetti(){const c=document.getElementById('confetti'),x=c.getContext('2d');c.width=c.offsetWidth*2;c.height=c.offsetHeight*2;
  const cols=['#ff7aa6','#3cc1bd','#f3c56b','#ffffff','#b28cff'];
  const ps=Array.from({length:180},()=>({x:Math.random()*c.width,y:-30-Math.random()*c.height*.6,vx:(Math.random()-.5)*5,vy:3+Math.random()*6,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:10+Math.random()*12,col:cols[Math.floor(Math.random()*5)]}));
  const t0=performance.now();(function f(now){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(now-t0<3600)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})(t0);}

/* ---------- controles: START o espacio = jugar; tocar la caseta = disparar ---------- */
goBtn.onclick=start;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();start();}});
function goFull(){const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;
  if(f&&!(document.fullscreenElement||document.webkitFullscreenElement)){try{const p=f.call(d,{navigationUI:'hide'});p&&p.catch&&p.catch(()=>{})}catch(e){}}}
addEventListener('pointerdown',goFull,{once:true});
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')goFull()});
drawAmmo();drawScore();
</script>

</body></html>
